# Poseiosc — XcodeGen project spec (source of truth for Poseiosc.xcodeproj).
#
# The generated Poseiosc.xcodeproj is committed so end users only need Xcode.
# After adding/removing source files, regenerate with:
#   xcodegen generate

name: Poseiosc
options:
  bundleIdPrefix: com.joelgethinlewis
  deploymentTarget:
    iOS: "18.0"
    macOS: "15.0"
  createIntermediateGroups: true

packages:
  swift-osc:
    url: https://github.com/orchetect/swift-osc
    from: 3.1.0
  PoseioscShared:
    path: PoseioscShared

attributes:
  LastUpgradeCheck: "2630"

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Users select their own team in Xcode → Signing & Capabilities.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    # Xcode's recommended settings (kept here, not applied via Xcode's
    # migration button, because the project file is regenerated by XcodeGen).
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_FRAMEWORK_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES

targets:
  PoseioscSender:
    type: application
    platform: iOS
    sources: [Sender]
    dependencies:
      - package: swift-osc
        product: SwiftOSC
      - package: PoseioscShared
        product: PoseioscShared
    info:
      path: Sender/Info.plist
      properties:
        CFBundleDisplayName: Poseiosc
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Standard-encryption-only exemption: skips the export compliance
        # question on every TestFlight upload.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Camera frames are analyzed on-device to detect bodies, hands, faces, text, and animals. No video leaves the phone — only OSC tracking data."
        NSLocalNetworkUsageDescription: "Poseiosc sends OSC tracking data to receivers on your local network and browses for them via Bonjour."
        NSBonjourServices: ["_osc._udp"]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Bump CURRENT_PROJECT_VERSION for every TestFlight upload;
        # MARKETING_VERSION is the user-facing version.
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"

  PoseioscReceiver:
    type: application
    platform: macOS
    sources: [Receiver]
    dependencies:
      - package: swift-osc
        product: SwiftOSC
      - package: PoseioscShared
        product: PoseioscShared
    info:
      path: Receiver/Info.plist
      properties:
        CFBundleDisplayName: Poseiosc Receiver
        NSLocalNetworkUsageDescription: "Poseiosc Receiver listens for OSC tracking data and advertises itself on your local network via Bonjour."
        NSBonjourServices: ["_osc._udp"]
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Sandbox/Hardened Runtime as build settings (Xcode's recommended
        # migration). The network entitlements have no build-setting
        # equivalent, so they stay in the entitlements file.
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    entitlements:
      path: Receiver/PoseioscReceiver.entitlements
      properties:
        com.apple.security.network.server: true
        com.apple.security.network.client: true

schemes:
  PoseioscSender:
    build:
      targets:
        PoseioscSender: all
    run:
      config: Debug
  PoseioscReceiver:
    build:
      targets:
        PoseioscReceiver: all
    run:
      config: Debug
